name: nova_tv
description: NOVA TV - Lecteur IPTV pour Android TV, Google TV et Fire TV
publish_to: 'none'
version: 1.1.0+8

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Moteur video PRO v8 : media_kit (libmpv).
  # - decodage materiel : image plus fluide sur les chaines HD/4K
  # - gros buffer configurable : moins de micro-coupures
  # - volume boostable au-dela de 100% (jusqu'a 200%)
  media_kit: 1.1.10+1
  media_kit_video: 1.2.4
  media_kit_libs_video: 1.0.4

  # Reseau
  http: 1.2.2

  # Stockage local (aucun serveur, aucun compte)
  hive: 2.2.3
  hive_flutter: 1.1.0
  path_provider: 2.1.4

  # Interface
  cached_network_image: 3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 4.0.0
  flutter_launcher_icons: 0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

flutter_launcher_icons:
  android: true
  image_path: "assets/logo.png"
  adaptive_icon_background: "#05060A"
  adaptive_icon_foreground: "assets/logo.png"
